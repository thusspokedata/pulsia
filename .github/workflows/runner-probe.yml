name: Runner probe

# Verifica que el runner self-hosted de la Pi NO tenga privilegios (Kan as935814afkj).
# Falla si el job puede usar docker, sudo general o leer /home/kilo.

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    runs-on: [self-hosted, pulsia-deploy]
    timeout-minutes: 5
    steps:
      - name: Sin docker, sin sudo, sin /home/kilo
        run: |
          set -u
          fail=0
          echo "== id"; id
          if docker ps >/dev/null 2>&1; then echo "FALLA: docker ps anda"; fail=1; else echo "ok: docker ps falla"; fi
          if sudo -n true 2>/dev/null; then echo "FALLA: sudo -n true anda"; fail=1; else echo "ok: sudo -n true falla"; fi
          if ls /home/kilo >/dev/null 2>&1 || [ -x /home/kilo ]; then echo "FALLA: lista o atraviesa /home/kilo"; fail=1; else echo "ok: no lista ni atraviesa /home/kilo"; fi
          # sudo -l: la única regla permitida es el script de deploy con el sha validado (o ninguna).
          expected='(root) NOPASSWD: /usr/local/sbin/deploy-pulsia ^[0-9a-f]{40}$'
          if list=$(LC_ALL=C sudo -n -l 2>&1); then
            rules=$(printf '%s\n' "$list" | sed -n '/may run the following commands/,$p' | tail -n +2 | sed 's/^[[:space:]]*//' | grep -v '^$' || true)
            echo "== reglas sudo:"; printf '%s\n' "$rules"
            if [ "$rules" != "$expected" ]; then echo "FALLA: sudo permite algo distinto del deploy"; fail=1; else echo "ok: sudo solo permite deploy-pulsia <sha>"; fi
          elif printf '%s' "$list" | grep -q 'may not run sudo'; then
            echo "ok: sin ninguna regla de sudo"
          else
            echo "FALLA: no se pudieron verificar las reglas de sudo ($list)"; fail=1
          fi
          exit "$fail"
