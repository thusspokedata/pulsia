name: Runner probe

# Verifica que el runner self-hosted de la Pi NO tenga privilegios (Kan as935814afkj).
# Falla si el job puede usar docker, sudo general o leer /home/kilo.

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    runs-on: [self-hosted, pulsia-deploy]
    timeout-minutes: 5
    steps:
      - name: Sin docker, sin sudo, sin /home/kilo
        run: |
          set -u
          fail=0
          echo "== id"; id
          # Solo vale como "sin docker" un permission denied (no un daemon caído o docker ausente).
          if out=$(LC_ALL=C docker ps 2>&1); then echo "FALLA: docker ps anda"; fail=1
          elif printf '%s' "$out" | grep -qiE 'permission denied while trying to connect to the docker (API|daemon socket)'; then echo "ok: docker ps -> socket denegado"
          else echo "FALLA: docker ps inconcluso ($out)"; fail=1; fi
          if sudo -n true 2>/dev/null; then echo "FALLA: sudo -n true anda"; fail=1; else echo "ok: sudo -n true falla"; fi
          if ls /home/kilo >/dev/null 2>&1 || [ -x /home/kilo ]; then echo "FALLA: lista o atraviesa /home/kilo"; fail=1; else echo "ok: no lista ni atraviesa /home/kilo"; fi
          # Grupos que equivalen a root.
          if id -nG | tr ' ' '\n' | grep -qxE 'docker|lxd|disk|sudo|wheel|adm'; then echo "FALLA: grupo privilegiado ($(id -nG))"; fail=1; else echo "ok: sin grupos privilegiados"; fi
          # Nada de lo que ejecuta root debe ser escribible por el runner.
          for p in / /usr /usr/local /usr/local/sbin /usr/local/sbin/deploy-pulsia /srv /srv/pulsia /srv/pulsia/compose.yml /etc /etc/sudoers.d /var/run/docker.sock; do
            if [ -w "$p" ]; then echo "FALLA: escribible $p"; fail=1; fi
          done
          # sudo -l: la única regla permitida es el script de deploy con el sha validado (o ninguna).
          expected='(root) NOPASSWD: /usr/local/sbin/deploy-pulsia ^[0-9a-f]{40}$'
          if list=$(LC_ALL=C sudo -n -l 2>&1); then
            rules=$(printf '%s\n' "$list" | sed -n '/may run the following commands/,$p' | tail -n +2 | sed 's/^[[:space:]]*//' | grep -v '^$' || true)
            echo "== reglas sudo:"; printf '%s\n' "$rules"
            # Defaults (todas las secciones antes de la lista de comandos: Matching Defaults y
            # Runas and Command-specific defaults): env_reset activo y env_keep/env_check solo con
            # las variables de proxy de Debian (+ locale/TZ en env_check).
            defaults=$(printf '%s\n' "$list" | sed -n '1,/may run the following commands/p')
            if printf '%s' "$defaults" | grep -qE '!env_reset|setenv|SETENV'; then echo "FALLA: sudo Defaults permite pasar entorno"; fail=1; fi
            keep=$(printf '%s' "$defaults" | grep -oE 'env_(keep|check)\+?="?[^",]*' | sed -E 's/^env_(keep|check)\+?="?//' | tr ' ' '\n' | grep -v '^$' | sort -u)
            extra_keep=$(printf '%s\n' "$keep" | grep -vxE 'NO_AT_BRIDGE|DPKG_DEB_THREADS_MAX|(http|https|ftp|no)_proxy|(HTTP|HTTPS|FTP|NO)_PROXY|RSYNC_PROXY|LANG|LANGUAGE|LC_[A-Z_]+|TZ' || true)
            if [ -n "$extra_keep" ]; then echo "FALLA: env_keep/env_check inesperado: $extra_keep"; fail=1; else echo "ok: sudo Defaults sin entorno extra"; fi
            if [ "$rules" != "$expected" ]; then echo "FALLA: sudo permite algo distinto del deploy"; fail=1; else echo "ok: sudo solo permite deploy-pulsia <sha>"; fi
          elif printf '%s' "$list" | grep -q 'may not run sudo'; then
            echo "ok: sin ninguna regla de sudo"
          else
            echo "FALLA: no se pudieron verificar las reglas de sudo ($list)"; fail=1
          fi
          exit "$fail"
