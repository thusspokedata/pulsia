name: Claude Code

# Se dispara cuando alguien menciona @claude en un comentario/issue/review.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Solo corre si el disparador contiene "@claude".
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # En tag mode, la Action postea un comentario placeholder y luego Claude lo REEMPLAZA con el
    # resultado — para eso Claude necesita write sobre pull-requests/issues (con read se queda en el
    # placeholder y termina en ~2s sin hacer nada). Ver README de anthropics/claude-code-action.
    permissions:
      contents: read # review-only: no puede pushear código (subir a write si querés que edite)
      pull-requests: write
      issues: write
      id-token: write
      actions: read # leer resultados de CI del PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pre-instalamos las deps en un step normal (con red completa, FUERA del sandbox de
      # Claude). Así, cuando Claude corre tests/typecheck, ya encuentra node_modules y no
      # necesita red en su runtime — que es lo que antes lo dejaba en "static review only".
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Le permitimos SOLO correr los scripts de bun (no shell arbitrario). Con las deps
          # ya instaladas puede verificar sus afirmaciones: `bun run typecheck` (todos los
          # workspaces), `bun run test` (shared+backend), `bun run test:mobile` (jest mobile).
          claude_args: |
            --allowedTools "Bash(bun run:*),Bash(bun test:*),Bash(bunx:*)"
