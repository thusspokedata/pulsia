name: Deploy backend (Pi)

# Deploy del backend a la Raspberry Pi (pi-web) en cada push a main.
#
# Desde 18/11/2026 (Kan as935814afkj) el runner de la Pi NO es root-equivalente:
#   1. build: la imagen arm64 se construye en un runner HOSTED de GitHub (ubuntu-24.04-arm)
#      y se publica en GHCR como ghcr.io/thusspokedata/pulsia-backend:<sha>.
#   2. deploy: el runner self-hosted (usuario gh-pulsia, sin docker ni sudo general, etiqueta
#      pulsia-deploy) solo puede correr `sudo /usr/local/sbin/deploy-pulsia <sha>`. Ese script de
#      root (lo mantiene infra, no está en este repo) baja la imagen, hace `up -d` con
#      /srv/pulsia/compose.yml y verifica /health. Migraciones + seed corren en el CMD de la imagen.
# Consecuencia: deploy/docker-compose.yml de este repo ya NO se usa en la Pi; cambios al compose
# de producción se piden a infra.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Nunca correr dos deploys en paralelo.
concurrency:
  group: deploy-pi
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build + push a GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/thusspokedata/pulsia-backend:${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            -f backend/Dockerfile \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          docker logout ghcr.io

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, pulsia-deploy]
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Deploy en la Pi (script fijo de root)
        env:
          # Token efímero del job, solo para el pull de GHCR; va por stdin, nunca como argumento.
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | sudo -n /usr/local/sbin/deploy-pulsia "$GITHUB_SHA"
