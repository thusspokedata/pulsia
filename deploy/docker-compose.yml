# Deploy del backend Pulsia en la Pi (local/VPN). Corre backend + Postgres pgvector.
# Uso en la Pi:  cd /home/kilo/pulsia && docker compose -f deploy/docker-compose.yml up -d --build
# Requiere deploy/app.env y deploy/.env (NO versionados; ver app.env.example y .env.example).
# Nota: la Pi de producción ya NO usa este archivo (desde #277 usa /srv/pulsia/compose.yml, que
# mantiene infra); este compose queda para quien se levante su propia instancia.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsia
      # Sale de deploy/.env (NO versionado; ver .env.example). Debe coincidir con la password de
      # DATABASE_URL en deploy/app.env. Ojo: POSTGRES_PASSWORD solo se aplica al CREAR el volumen;
      # para rotarla en una DB existente hay que hacer ALTER USER (ver docs/deploy-ci-setup.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: pulsia
    volumes:
      - pulsia_pgdata:/var/lib/postgresql/data
    # DB solo en la red interna del compose (no se publica el 5432 al host).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsia -d pulsia"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: app.env
    ports:
      - "3011:8787" # el teléfono le pega a http://<IP-de-la-Pi>:3011
    depends_on:
      db:
        condition: service_healthy

volumes:
  pulsia_pgdata:
